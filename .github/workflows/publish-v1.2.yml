name: Publish Warcraft III Windows 7 v1.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.2.yml'
      - '.github/v1.2-payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-war3-win7-v1.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore validated v1.2 files and verify 34 payload checksums
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v1.2-payload/part*.txt | base64 --decode > /tmp/war3-win7-v1.2.tar.xz
          echo "f557ef6ad7406fc4366c59dedc0de630def0870e3cf3c0542b8d9fe2917d2c58  /tmp/war3-win7-v1.2.tar.xz" | sha256sum --check --status
          tar -xJf /tmp/war3-win7-v1.2.tar.xz
          mkdir -p War3_3.0.1_WorldEditor_Win7_Fix_v1.2
          cp War3_3.0_WorldEditor_Win7_Fix_v1.1/dummy.w3m War3_3.0.1_WorldEditor_Win7_Fix_v1.2/dummy.w3m
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          paths = [line.split('  ', 1)[1] for line in Path('SHA256SUMS.txt').read_text(encoding='ascii').splitlines() if line.strip()]
          assert len(paths) == 34 and len(set(paths)) == 34, 'Expected 34 unique payload files'
          assert 'War3_3.0.1_WorldEditor_Win7_Fix_v1.2/dummy.w3m' in paths
          print('PACKAGE_VERIFICATION_OK filesOK=34 problems=0')
          PY

      - name: Commit validated v1.2 source files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md INSTALL.bat REMOVE.bat START_WARCRAFT_III.bat START_WORLD_EDITOR_FIXED.bat VERIFY_INSTALLATION.bat VERIFY_PACKAGE.bat SHA256SUMS.txt Documentation Runtime Tools War3_3.0.1_WorldEditor_Win7_Fix_v1.2
          if ! git diff --cached --quiet; then
            git commit -m 'Release v1.2: Warcraft III 3.0.1.24371 and World Editor Windows 7 fixes'
            git push origin HEAD:main
          fi

      - name: Build complete v1.2 ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from hashlib import sha256
          name = 'War3_3.0.1_Win7_Compatibility_Pack_v1.2'
          lines = [line for line in Path('SHA256SUMS.txt').read_text(encoding='ascii').splitlines() if line.strip()]
          relpaths = []
          for line in lines:
              digest, rel = line.split('  ', 1)
              src = Path(rel)
              if not src.is_file() or sha256(src.read_bytes()).hexdigest() != digest:
                  raise SystemExit('HASH_CHECK_FAILED: ' + rel)
              relpaths.append(rel)
          assert len(relpaths) == 34
          zpath = Path(name + '.zip')
          with ZipFile(zpath, 'w', ZIP_DEFLATED, compresslevel=9) as zf:
              for rel in sorted(relpaths + ['SHA256SUMS.txt']):
                  zf.write(rel, (Path(name) / rel).as_posix())
          check = Path(name + '_SHA256.txt')
          check.write_text(f'{sha256(zpath.read_bytes()).hexdigest()}  {zpath.name}\n', encoding='ascii')
          with ZipFile(zpath) as zf:
              assert zf.testzip() is None
              assert len(zf.namelist()) == 35
          print('RELEASE_ARCHIVE_OK files=35 zipsha256=' + sha256(zpath.read_bytes()).hexdigest())
          PY

      - name: Tag validated source revision v1.2
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1.2 "$(git rev-parse HEAD)"
          git push origin refs/tags/v1.2 --force

      - name: Publish GitHub latest release v1.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP='War3_3.0.1_Win7_Compatibility_Pack_v1.2.zip'
          SUM='War3_3.0.1_Win7_Compatibility_Pack_v1.2_SHA256.txt'
          TITLE='Warcraft III 3.0.1.24371 Windows 7 Compatibility Pack v1.2'
          if gh release view v1.2 >/dev/null 2>&1; then
            gh release edit v1.2 --title "$TITLE" --notes-file Documentation/RELEASE_NOTES.md --latest
            gh release upload v1.2 "$ZIP" "$SUM" --clobber
          else
            gh release create v1.2 "$ZIP" "$SUM" --target "$(git rev-parse HEAD)" --title "$TITLE" --notes-file Documentation/RELEASE_NOTES.md --latest
          fi
